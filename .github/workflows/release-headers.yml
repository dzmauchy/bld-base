name: Release headers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Download clang-wasm assets
        run: |
          set -euo pipefail
          assets=".cache/clang-23.1.2"
          release_url="https://github.com/dzmauchy/clang-wasm/releases/download/clang-23.1.2"
          mkdir -p "${assets}"
          for asset in clang.js clang.wasm sysroot.tgz; do
            curl --fail --location --silent --show-error --retry 3 \
              "${release_url}/${asset}" -o "${assets}/${asset}"
          done

      - name: Generate metadata
        run: node .github/scripts/generate-meta.mjs

      - name: Publish headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          tag="v${version}"
          archive="base-${version}.tar.gz"
          tar -czf "${archive}" -C "${GITHUB_WORKSPACE}/src" . -C "${GITHUB_WORKSPACE}/.cache" meta.json
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes --cleanup-tag
          fi
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}" --force
          gh release create "${tag}" "${archive}" --target "${GITHUB_SHA}" --title "${tag}" --notes "BASE ${version}"
