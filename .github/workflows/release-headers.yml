name: Release headers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)"
          tag="v${version}"
          archive="base-${version}.tar.gz"
          tar -czf "${archive}" -C src .
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --yes --cleanup-tag
          fi
          git tag -f "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}" --force
          gh release create "${tag}" "${archive}" --target "${GITHUB_SHA}" --title "${tag}" --notes "BASE ${version}"
